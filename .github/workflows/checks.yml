name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: python3 scripts/build.py verify
      - run: node Tests/test_smoke_fixture.mjs
  native-client:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: swift test
      - run: swift build --product CobbleChromiumClient
